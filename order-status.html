<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Status Tempahan | B@Bistro</title>

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/pages/order-status.css">

</head>

<body>

    <!--==========================================
        HEADER
    ===========================================-->

    <header class="order-header container">

        <div class="order-header-spacer"></div>

        <div class="order-logo">

            <img
                src="images/logo/logo coloured.svg"
                alt="B@Bistro">

        </div>

        <span class="order-header-icon">

            <i class="bi bi-receipt"></i>

        </span>

    </header>


    <!--==========================================
        MAIN
    ===========================================-->

    <main class="container">

        <!--======================================
            SUCCESS
        =======================================-->

        <section class="order-success">

            <div class="success-icon">

                <i class="bi bi-check-lg"></i>

            </div>

            <h1>
                Tempahan Berjaya!
            </h1>

            <p>
                Terima kasih kerana membuat tempahan
                di B@Bistro.
            </p>

        </section>


        <!--======================================
            ORDER NUMBER
        =======================================-->

        <section class="order-number-card">

            <span>
                Nombor Tempahan
            </span>

            <strong id="orderId">
                BAB-0000
            </strong>

        </section>


        <!--======================================
            ORDER STATUS
        =======================================-->

        <section class="status-card">

            <div class="status-icon">

                <i class="bi bi-clock-history"></i>

            </div>

            <div class="status-info">

                <span>
                    Status Tempahan
                </span>

                <strong id="orderStatus">
                    Menunggu
                </strong>

            </div>

        </section>


        <!--======================================
            ORDER INFORMATION
        =======================================-->

        <section class="order-section">

            <h2>
                Maklumat Tempahan
            </h2>

            <div class="order-info-card">

                <div class="info-row">

                    <span>
                        <i class="bi bi-table"></i>
                        Nombor Meja
                    </span>

                    <strong id="orderTable">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>
                        <i class="bi bi-credit-card"></i>
                        Pembayaran
                    </span>

                    <strong id="orderPayment">
                        -
                    </strong>

                </div>


                <div class="info-row">

                    <span>
                        <i class="bi bi-chat-left-text"></i>
                        Komen
                    </span>

                    <strong id="orderNotes">
                        -
                    </strong>

                </div>

                <div class="info-row">

                    <span>
                        <i class="bi bi-basket"></i>
                        Jumlah Item
                    </span>

                    <strong id="orderItems">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!--======================================
            ORDER ITEMS
        =======================================-->

        <section class="order-section">

            <h2>
                Pesanan Anda
            </h2>

            <div
                id="orderItemsContainer"
                class="order-items">

                <!-- Item akan dijana oleh order-status.js -->

            </div>

        </section>


        <!--======================================
            TOTAL
        =======================================-->

        <section class="order-total">

            <span>
                Jumlah Bayaran
            </span>

            <strong id="orderTotal">
                RM 0.00
            </strong>

        </section>


        <!--======================================
            ACTION
        =======================================-->

        <section class="order-action">

            <a
                href="menu.html"
                class="btn btn-primary">

                <i class="bi bi-house"></i>

                Kembali ke Menu

            </a>

        </section>

    </main>


    <!--==========================================
        JAVASCRIPT
    ===========================================-->

    <script src="js/order-status.js"></script>

</body>

</html>
