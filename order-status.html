<!DOCTYPE html>
<html lang="ms">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Status Pesanan | B@Bistro</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS Utama -->
    <link rel="stylesheet"
        href="css/style.css">

    <!-- CSS Order Status -->
    <link rel="stylesheet"
        href="css/pages/order-status.css">

</head>

<body>

    <!--==========================================
        HEADER
    ===========================================-->

    <header class="order-header container">

        <a href="index.html"
            class="order-home-btn">

            <i class="bi bi-house"></i>

        </a>

        <img
            src="images/logo/logo coloured.svg"
            alt="B@Bistro"
            class="order-logo">

        <a href="cart.html"
            class="order-cart-btn">

            <i class="bi bi-cart3"></i>

            <span
                class="cart-badge"
                id="cartBadge">

                0

            </span>

        </a>

    </header>


    <!--==========================================
        MAIN
    ===========================================-->

    <main class="order-status-page container">


        <!--======================================
            SUCCESS
        =======================================-->

        <section class="success-section">

            <div class="success-icon">

                <i class="bi bi-check-lg"></i>

            </div>

            <h1>
                Tempahan Berjaya!
            </h1>

            <p>
                Terima kasih kerana membuat tempahan
                di B@Bistro.
            </p>

        </section>


        <!--======================================
            ORDER NUMBER
        =======================================-->

        <section class="order-number-card">

            <span>
                Nombor Tempahan
            </span>

            <strong id="orderId">
                BAB-0000
            </strong>

        </section>


        <!--======================================
            CURRENT STATUS
        =======================================-->

        <section class="current-status-card">

            <div
                class="status-icon"
                id="statusIcon">

                <i class="bi bi-clock"></i>

            </div>

            <div class="status-content">

                <span class="status-label">
                    Status Tempahan
                </span>

                <h2 id="statusTitle">
                    Menunggu
                </h2>

                <p id="statusDescription">
                    Pesanan anda telah diterima.
                </p>

            </div>

        </section>


        <!--======================================
            ORDER INFORMATION
        =======================================-->

        <section class="order-info-section">

            <h2>
                Maklumat Tempahan
            </h2>


            <div class="order-info-card">


                <!-- MEJA -->

                <div class="info-row">

                    <div class="info-left">

                        <i class="bi bi-grid-3x3-gap"></i>

                        <span>
                            Nombor Meja
                        </span>

                    </div>

                    <strong id="orderTable">
                        Meja -
                    </strong>

                </div>


                <!-- PAYMENT -->

                <div class="info-row">

                    <div class="info-left">

                        <i class="bi bi-credit-card"></i>

                        <span>
                            Pembayaran
                        </span>

                    </div>

                    <strong id="orderPayment">
                        -
                    </strong>

                </div>


                <!-- NOTES -->

                <div class="info-row">

                    <div class="info-left">

                        <i class="bi bi-chat-left-text"></i>

                        <span>
                            Komen
                        </span>

                    </div>

                    <strong id="orderNotes">
                        Tiada komen
                    </strong>

                </div>


                <!-- TOTAL -->

                <div class="info-row">

                    <div class="info-left">

                        <i class="bi bi-receipt"></i>

                        <span>
                            Jumlah
                        </span>

                    </div>

                    <strong id="orderTotal">
                        RM 0.00
                    </strong>

                </div>

            </div>

        </section>


        <!--======================================
            ORDER SUMMARY
        =======================================-->

        <section class="order-summary-section">

            <h2>
                Ringkasan Pesanan
            </h2>

            <div
                class="order-summary-card"
                id="orderItems">

            </div>

        </section>


        <!--======================================
            BACK TO HOME
        =======================================-->

        <a href="index.html"
            class="btn btn-primary back-home-btn">

            <i class="bi bi-house"></i>

            Kembali ke Laman Utama

        </a>


    </main>


    <!--==========================================
        JAVASCRIPT
    ===========================================-->

    <script src="js/order-status.js"></script>

</body>

</html>
